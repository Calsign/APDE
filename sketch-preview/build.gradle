apply plugin: 'com.android.application'

android {
    namespace 'com.calsignlabs.apde.sketchpreview'

    compileSdkVersion 35

    defaultConfig {
        applicationId "com.calsignlabs.apde.sketchpreview"
        minSdkVersion 19
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    sourceSets {
        main {
            // we copy the icons from APDE
            res.srcDirs += [project.previewRes]
        }
    }
}

preBuild.dependsOn project.createPreviewRes

dependencies {
    // use the same dependencies that we use to build apps in APDE
    implementation files(rootProject.configurations.commonArtifacts.files) {
        builtBy rootProject.configurations.commonArtifacts.buildDependencies
    }
}
